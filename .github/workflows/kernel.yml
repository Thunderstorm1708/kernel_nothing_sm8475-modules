# SPDX-License-Identifier: GPL-2.0
#
# Build the Nothing Phone (2) 6.12 kernel the way a LineageOS 24.0 ROM build
# does (same prebuilt toolchain, same make steps and module packaging), then
# compare it with redducc's kleaf build.
name: Kernel (LineageOS inline build)

on:
  push:
    # ci-run: push any commit of 17-6.12 there to rebuild, e.g. after a change
    # of the kernel, devicetrees or device repos (which cannot trigger this).
    # Builds there use make -k, to collect all compile errors at once.
    branches: [17-6.12, ci-run]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: kernel_nothing_sm8475 branch
        default: 17-6.12
      devicetrees_branch:
        description: kernel_nothing_sm8475-devicetrees branch
        default: 17-6.12
      device_branch:
        description: device_nothing_Pong branch
        default: 17-6.12-src
      lineage_branch:
        description: LineageOS branch (toolchain versions)
        default: lineage-24.0
      keep_going:
        description: Diagnostics, make -k (collect all compile errors)
        type: boolean
        default: false
      rom_url:
        description: ROM zip to check this kernel against (default .github/ci/test-rom.url)
        default: ''

permissions:
  contents: write

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true

env:
  OWNER: Thunderstorm1708
  KERNEL_BRANCH: ${{ inputs.kernel_branch || '17-6.12' }}
  DEVICETREES_BRANCH: ${{ inputs.devicetrees_branch || '17-6.12' }}
  DEVICE_BRANCH: ${{ inputs.device_branch || '17-6.12-src' }}
  LINEAGE_BRANCH: ${{ inputs.lineage_branch || 'lineage-24.0' }}
  CI_KEEP_GOING: ${{ (inputs.keep_going || github.ref_name == 'ci-run') && '1' || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af >/dev/null || true
          df -h /

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc cpio device-tree-compiler git kmod libelf-dev libssl-dev lz4 \
            python3 rsync patch zip zlib1g-dev >/dev/null

      - name: Sources (ROM tree layout)
        run: |
          mkdir -p tree && cd tree
          git clone -q --depth=1 -b "$KERNEL_BRANCH" https://github.com/$OWNER/kernel_nothing_sm8475 kernel/nothing/sm8475
          git init -q kernel/nothing/sm8475-modules
          git -C kernel/nothing/sm8475-modules fetch -q --depth=1 https://github.com/${{ github.repository }} ${{ github.sha }}
          git -C kernel/nothing/sm8475-modules checkout -q FETCH_HEAD
          git clone -q --depth=1 -b "$DEVICETREES_BRANCH" https://github.com/$OWNER/kernel_nothing_sm8475-devicetrees kernel/nothing/sm8475-devicetrees
          git clone -q --depth=1 -b "$DEVICE_BRANCH" https://github.com/$OWNER/device_nothing_Pong device/nothing/Pong
          for d in kernel/nothing/sm8475 kernel/nothing/sm8475-modules kernel/nothing/sm8475-devicetrees device/nothing/Pong; do
            echo "$d $(git -C $d log -1 --format='%h %s')"
          done | tee ../sources.txt

      - name: LineageOS toolchain prebuilts
        working-directory: tree
        run: bash kernel/nothing/sm8475-modules/.github/ci/fetch-prebuilts.sh 2>&1 | tee ../prebuilts.log

      - name: Build (as kernel.mk does)
        working-directory: tree
        run: |
          set -o pipefail
          CI_TEST_IMAGE=1 bash kernel/nothing/sm8475-modules/.github/ci/lineage-kernel.sh 2>&1 | tee ../build.log

      - name: Compare with redducc's kleaf build
        if: success()
        working-directory: tree
        run: |
          git clone -q --depth=1 https://github.com/redducc-stuff/android_device_nothing_phone2-kernel ../reference
          P=out/target/product/Pong
          CLANG=$(ls -d prebuilts/clang/host/linux-x86/clang-*/bin | head -1)
          LLVM_NM=$PWD/$CLANG/llvm-nm python3 kernel/nothing/sm8475-modules/.github/ci/compare_modules.py \
            $P/vendor_dlkm/lib/modules ../reference | tee ../compare.txt
          {
            echo "dtb.img vs cape-v2 + cape + capep: $(cat ../reference/dtbs/cape-v2.dtb ../reference/dtbs/cape.dtb ../reference/dtbs/capep.dtb | cmp -s - $P/dtb.img && echo identical || echo DIFFERENT)"
            n=$(stat -c %s $P/dtbo.img)
            echo "dtbo.img vs reference (without its AVB padding): $(cmp -s -n $n $P/dtbo.img ../reference/dtbs/dtbo.img && echo identical || echo DIFFERENT)"
            # GKI modules must keep the signature of this build: unsigned ones may not
            # export protected GKI symbols (CONFIG_MODULE_SIG_PROTECT), e.g. rfkill in vendor_boot
            unsigned=$(for m in $(find $P/vendor_dlkm $P/vendor_ramdisk -name '*.ko'); do
              b=$(basename $m .ko); grep -qx ".*/$b" kernel/nothing/sm8475/android/protected_module_names_list || continue
              [ -n "$(modinfo -F signer $m)" ] || echo $b; done | sort -u | tr '\n' ' ')
            echo "protected GKI modules without a signature: ${unsigned:-none}"
            signed_vendor=$(find $P/vendor_dlkm -name '*.ko' -path '*' | while read m; do
              b=$(basename $m .ko); grep -qx ".*/$b" kernel/nothing/sm8475/android/protected_module_names_list && continue
              grep -q "/$b.ko\$" <(find $P/obj/PACKAGING/kernel_modules_intermediates/lib/modules/*/kernel -name '*.ko') && continue
              [ -z "$(modinfo -F signer $m)" ] || echo $b; done | wc -l)
            echo "signed vendor (non-GKI) modules: $signed_vendor (a kleaf build signs none)"
            [ -z "$unsigned" ] || { echo "::error::protected GKI modules are not signed: $unsigned"; exit 1; }
          } | tee -a ../compare.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Pong kernel, LineageOS inline build"
            echo '```'; cat sources.txt 2>/dev/null; echo '```'
            echo '```'; grep -hE "^clang " prebuilts.log 2>/dev/null; grep -hE "^clang:" build.log 2>/dev/null; echo '```'
            echo "### Steps"; echo '```'; grep -E "^==== |ERROR|modules, " build.log 2>/dev/null; echo '```'
            if [ -f compare.txt ]; then echo "### Comparison with redducc's build"; echo '```'; cat compare.txt; echo '```'; fi
            echo "### Last lines of the build log"; echo '```'; tail -n 40 build.log 2>/dev/null; echo '```'
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        if: success()
        working-directory: tree/out/target/product/Pong
        run: |
          cp obj/KERNEL_OBJ/.config kernel.config
          cp obj/KERNEL_OBJ/System.map obj/KERNEL_OBJ/Module.symvers obj/KERNEL_OBJ/.vmlinux.permitted-imports.c .
          cp ../../../../kernel/nothing/sm8475/android/protected_module_names_list .
          zip -qr ../../../../../Pong-kernel.zip kernel kernel-test-nosigprotect dtb.img dtbo.img kernel.config System.map Module.symvers \
            .vmlinux.permitted-imports.c protected_module_names_list vendor_dlkm vendor_ramdisk recovery

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Pong-kernel-${{ github.run_number }}
          path: Pong-kernel.zip
          retention-days: 14

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p logs && cd logs
          cp ../summary.md ../sources.txt ../compare.txt . 2>/dev/null || true
          for f in prebuilts build; do [ -f ../$f.log ] && gzip -c ../$f.log > $f.log.gz; done
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Kernel CI run ${{ github.run_number }} (${{ job.status }}) for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs

  # A flashable AnyKernel3 zip of this kernel, and a check of a ROM (PenguinOS,
  # redducc's 6.12) whose modules would run with it when only the kernel is
  # flashed: the zip replaces the kernel of the boot image, nothing else.
  anykernel:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pong-kernel-${{ github.run_number }}

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils kmod lz4 cpio zip llvm >/dev/null
          unzip -q Pong-kernel.zip -d k
          git init -q ci && git -C ci fetch -q --depth=1 https://github.com/${{ github.repository }} ${{ github.sha }} && git -C ci checkout -q FETCH_HEAD

      - name: AnyKernel3 zip
        run: |
          git clone -q https://github.com/osm0sis/AnyKernel3 ak3
          git -C ak3 checkout -q 41f04bd
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/modules ak3/patch ak3/ramdisk
          cp ci/.github/ci/anykernel.sh ak3/anykernel.sh
          # the test Image: other ROMs' GKI modules are signed by another key
          cp k/kernel-test-nosigprotect ak3/Image
          rel=$(strings k/kernel | grep -m1 -o "Linux version [^ ]*" | cut -d' ' -f3)
          sed -i "s|@RELEASE@|$rel|; s|@RUN@|${{ github.run_number }}|; s|@SHA@|${GITHUB_SHA::7}|" ak3/anykernel.sh
          (cd ak3 && zip -qr9 ../Pong-6.12-AnyKernel3-${{ github.run_number }}.zip .)
          echo "AnyKernel3 zip: kernel $rel" | tee anykernel.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Pong-6.12-AnyKernel3-${{ github.run_number }}
          path: Pong-6.12-AnyKernel3-${{ github.run_number }}.zip
          retention-days: 14

      - name: Check the test ROM's modules against this kernel
        if: inputs.rom_url != '' || github.ref_name == 'ci-run'
        run: |
          url="${{ inputs.rom_url }}"; [ -n "$url" ] || url=$(cat ci/.github/ci/test-rom.url)
          echo "ROM: $url" | tee rom-check.txt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          curl -sSfL --retry 3 -o rom.zip "$url"
          curl -sSfL -o pd.tgz https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          tar xzf pd.tgz payload-dumper-go
          unzip -q -o rom.zip payload.bin && rm rom.zip
          ./payload-dumper-go -o img -p boot,vendor_boot,dtbo,vendor_dlkm payload.bin >/dev/null && rm payload.bin
          git clone -q --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg
          python3 mkbootimg/unpack_bootimg.py --boot_img img/boot.img --out boot >/dev/null
          python3 mkbootimg/unpack_bootimg.py --boot_img img/vendor_boot.img --out vboot > vboot.txt
          { echo "ROM kernel: $(strings boot/kernel | grep -m1 'Linux version')"
            echo "this kernel: $(strings k/kernel | grep -m1 'Linux version')"
            echo "vendor_boot dtb vs this dtb.img: $(cmp -s vboot/dtb k/dtb.img && echo identical || echo DIFFERENT)"
            n=$(stat -c %s k/dtbo.img)
            echo "dtbo vs this dtbo.img: $(cmp -s -n $n img/dtbo.img k/dtbo.img && echo identical || echo DIFFERENT)"
          } | tee -a rom-check.txt
          mkdir -p rom/vendor_dlkm rom/vendor_ramdisk
          fsck.erofs --extract=rom/vendor_dlkm img/vendor_dlkm.img >/dev/null 2>&1 || \
            debugfs -R "rdump / rom/vendor_dlkm" img/vendor_dlkm.img >/dev/null 2>&1
          for r in vboot/vendor_ramdisk*; do
            (cd rom/vendor_ramdisk && { lz4 -dc "../../$r" 2>/dev/null || gzip -dc "../../$r"; } | cpio -idm --quiet 2>/dev/null) || true
          done
          V=$(modinfo -F vermagic $(find k/vendor_dlkm -name '*.ko' | head -1))
          LLVM_NM=llvm-nm python3 ci/.github/ci/check_rom_modules.py k/Module.symvers k/.vmlinux.permitted-imports.c \
            k/protected_module_names_list "$V" \
            rom/vendor_dlkm rom/vendor_ramdisk | tee -a rom-check.txt
          echo "ROM modules not built here: $(comm -23 <(find rom -name '*.ko' -printf '%f\n' | sort -u) <(find k/vendor_dlkm -name '*.ko' -printf '%f\n' | sort -u) | tr '\n' ' ')" | tee -a rom-check.txt

      - name: Publish to the ci-logs branch
        if: always()
        run: |
          git clone -q --depth=1 -b ci-logs https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} logs || exit 0
          cp anykernel.txt rom-check.txt logs/ 2>/dev/null || true
          cd logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "AnyKernel3 / ROM check, run ${{ github.run_number }}" && git push -q origin HEAD:ci-logs || true
          cat ../rom-check.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
